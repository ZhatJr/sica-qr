<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SICA-QR</title>
    <style>
        body { font-family: "Segoe UI", system-ui, sans-serif; background: #f4f6f9; color: #1e2a38;
               display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; padding: 16px; }
        .caja { background: #fff; border: 1px solid #d7dee6; border-radius: 10px; padding: 32px; max-width: 480px; }
        h1 { margin: 0 0 4px; color: #123a5e; }
        p { color: #5b6878; line-height: 1.5; }
        .ok { display: inline-block; background: #dff3e8; color: #15603e; padding: 4px 12px;
              border-radius: 12px; font-weight: 600; font-size: 14px; }
    </style>
</head>
<body>
<div class="caja">
    <h1>SICA-QR</h1>
    <p>I.E. N.° 14762 "Luciano Castillo Colonna"</p>
    <span class="ok">Servidor funcionando</span>
    <p>El backend y la API REST están activos. Las pantallas del sistema
       se agregan en la rama <strong>frontend</strong>.</p>
    <p>Para probar la API, abre <code>pruebas-api.http</code> en VS Code.</p>
</div>
</body>
</html>
