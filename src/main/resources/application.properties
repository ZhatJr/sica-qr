# ===================================================================
#  SICA-QR | Configuracion de la aplicacion
# ===================================================================

spring.application.name=SICA-QR
server.port=8080

# -------------------------------------------------------------------
#  Conexion a PostgreSQL
#  La base "sica_qr" se crea con los scripts 01 y 02 de la carpeta bd/
#
#  CONTRASENA: escribe aqui la que pusiste al instalar PostgreSQL,
#  en lugar de "postgres".
#
#  stringtype=unspecified: permite guardar texto en las columnas
#  JSONB (auditoria.detalle) e INET (auditoria.direccion_ip).
# -------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/sica_qr?stringtype=unspecified
spring.datasource.username=postgres
spring.datasource.password=postgres

# -------------------------------------------------------------------
#  JPA / Hibernate
#  ddl-auto=none: Java NO crea ni modifica tablas. La estructura la
#  define el script SQL del segundo avance.
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# -------------------------------------------------------------------
#  Sesion: se cierra tras 30 minutos sin actividad (RNF-04)
# -------------------------------------------------------------------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

# Respuestas JSON con fechas en formato texto (2026-10-27T07:35:00)
spring.jackson.serialization.write-dates-as-timestamps=false
