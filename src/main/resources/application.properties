# ===================================================================
#  SICA-QR | Configuracion de la aplicacion
# ===================================================================

spring.application.name=SICA-QR
server.port=8080

# -------------------------------------------------------------------
#  Conexion a PostgreSQL (base creada con los scripts de bd/)
#  stringtype=unspecified: necesario para las columnas JSONB e INET.
#  La contrasena real se define en config/application.properties
#  (excluido del repositorio); el valor de abajo es solo por defecto.
# -------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/sica_qr?stringtype=unspecified
spring.datasource.username=postgres
spring.datasource.password=postgres

# -------------------------------------------------------------------
#  JPA / Hibernate
#  ddl-auto=none: el esquema lo define el script SQL
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# -------------------------------------------------------------------
#  Sesion: expira tras 30 minutos de inactividad (RNF-04)
# -------------------------------------------------------------------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Spring Security: los usuarios se validan contra la tabla usuario
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Fechas en formato ISO en las respuestas JSON
spring.jackson.serialization.write-dates-as-timestamps=false
